services:
  db:
    image: postgres:15                                    #docker-compose.yml
    container_name: bunyodkora_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bunyodkor_net

  web:
    build: .
    container_name: weba                   # 👈 MUHIM: nomi "web" bo‘lishi kerak
    command: uvicorn main:app --host 0.0.0.0 --port 8008
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - bunyodkor_net
    ports:
      - "8008:8008"


volumes:
  postgres_data:

networks:
  bunyodkor_net:
    driver: bridge

